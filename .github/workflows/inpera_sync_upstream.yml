name: INPERA - Sync upstream Chatwoot

on:
  schedule:
    - cron: '17 10 * * 1' # Segunda, 07h17 America/Sao_Paulo
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release publicada vX.Y.Z; vazio seleciona a maior estável'
        type: string
        default: ''
      dry_run:
        description: 'Somente consultar; sem branch, PR, issue ou Slack'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: inpera-upstream-release
  cancel-in-progress: false

jobs:
  synchronize:
    # The schedule is deliberately gated until manual homologation is complete.
    if: >-
      github.repository == 'ViniciosTDP/chatwoot' && github.ref == 'refs/heads/inpera_chat' &&
      (github.event_name == 'workflow_dispatch' || vars.INPERA_SYNC_ENABLED == 'true')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout protected automation
        uses: actions/checkout@v7.0.1
        with:
          ref: inpera_chat
          fetch-depth: 0
          persist-credentials: false
      - name: Setup Node for trusted tooling only
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'
      - name: Preserve trusted scripts outside merge worktree
        id: trusted
        run: |
          mkdir -p "$RUNNER_TEMP/inpera-trusted"
          cp script/sync_upstream_branches.sh .github/scripts/inpera-release.mjs "$RUNNER_TEMP/inpera-trusted/"
          git config user.name 'inpera-release[bot]'
          git config user.email 'inpera-release[bot]@users.noreply.github.com'
      - name: Create installation token scoped to this fork
        id: app
        uses: actions/create-github-app-token@v3.3.0
        with:
          app-id: ${{ vars.INPERA_SYNC_APP_ID }}
          private-key: ${{ secrets.INPERA_SYNC_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-workflows: write
      - name: Authenticate Git without persisting the token
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: gh auth setup-git
      - name: Prepare release proposal
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
          INPERA_SYNC_SCRIPT: ${{ runner.temp }}/inpera-trusted/sync_upstream_branches.sh
          INPERA_RELEASE_HELPER: ${{ runner.temp }}/inpera-trusted/inpera-release.mjs
          INPERA_SYNC_RESULT: ${{ runner.temp }}/inpera-sync-result.json
          INPERA_RELEASE_SLACK_WEBHOOK_URL: ${{ !inputs.dry_run && secrets.INPERA_RELEASE_SLACK_WEBHOOK_URL || '' }}
        # Never install dependencies, run hooks from upstream, or test upstream in this job.
        run: node "$RUNNER_TEMP/inpera-trusted/inpera-release.mjs" sync
      - name: Notify operational failure, including App authentication
        if: failure() && steps.trusted.outcome == 'success'
        env:
          INPERA_SYNC_RESULT: ${{ runner.temp }}/inpera-sync-result.json
          INPERA_RELEASE_SLACK_WEBHOOK_URL: ${{ !inputs.dry_run && secrets.INPERA_RELEASE_SLACK_WEBHOOK_URL || '' }}
        run: node "$RUNNER_TEMP/inpera-trusted/inpera-release.mjs" alert
      - name: Retain sanitized result
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: inpera-sync-result
          path: ${{ runner.temp }}/inpera-sync-result.json
          retention-days: 30
          if-no-files-found: warn
