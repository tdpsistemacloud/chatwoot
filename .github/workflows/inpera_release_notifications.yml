name: INPERA - Release notifications
on:
  workflow_run:
    workflows: ['Run Chatwoot CE spec']
    types: [completed]
  pull_request_target:
    branches: [inpera_chat]
    types: [closed]
permissions:
  contents: read
  actions: read
  pull-requests: read
jobs:
  notify:
    if: github.repository == 'tdpsistemacloud/chatwoot'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: inpera_chat
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Notify from protected code only
        env:
          GH_TOKEN: ${{ github.token }}
          INPERA_RELEASE_SLACK_WEBHOOK_URL: ${{ secrets.INPERA_RELEASE_SLACK_WEBHOOK_URL }}
        run: node .github/scripts/inpera-notify.mjs
